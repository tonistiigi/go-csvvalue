version: "2"

run:
  timeout: 10m

linters:
  default: none
  enable:
    - bodyclose
    - errname
    - forbidigo
    - gocritic
    - gosec
    - govet
    - importas
    - ineffassign
    - makezero
    - misspell
    - noctx
    - nolintlint
    - revive
    - staticcheck
    - unused
    - whitespace

formatters:
  enable:
    - gofmt
    - goimports
